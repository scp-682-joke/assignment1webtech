<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Student Grades</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
         <h1 id="page-heading">Student Grades</h1>
         <table class = "grades-table">
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Subject</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Zhibek Slambek</td>
                    <td>Mathematics</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Duman Zhanibekov</td>
                    <td>Science</td>
                    <td>B+</td>
                </tr>
                <tr class = "highlight">
                    <td>Daniyal Aqylbek</td>
                    <td>History</td>
                    <td>A-</td>
                </tr>
                <tr>
                    <td>Dinmukhammed Sailau</td>
                    <td colspan="2">Absent</td>
                </tr>
                <tr>
                    <td>Iaroslav Samonov</td>
                    <td>Physical Education</td>
                    <td>A+</td>
                </tr>
            </tbody>
        </table>
        <h2 id = "feedback-form-heading">Feedback Form</h2>
        <form class = "feedback-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="role">Role:</label>
        <select id="role" name="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="other">Other</option>
        </select>

        <p class="question">Did you find this page useful?</p>

        <div class="radio-group">
            <input type="radio" id="yes" name="useful" value="yes">
            <label for="yes">Yes</label>

            <input type="radio" id="no" name="useful" value="no">
            <label for="no">No</label>
        </div>

            <label for="feedback">Feedback:</label><br>
            <textarea id="feedback" name="feedback" rows="4" cols="50" required></textarea><br><br>

            <input type="submit" value="Submit">

        </form>
    </body>
</html>
